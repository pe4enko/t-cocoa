services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: t-cocoa-bot:local
    container_name: t-cocoa-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TBANK_CA_CERT_PATH: ${TBANK_CA_CERT_PATH:-certs/TINKOFFBANK-ROOTCA.pem}
    init: true
